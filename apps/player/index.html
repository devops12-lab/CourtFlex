<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#001321" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="description" content="Find courts, join open play and play with your club." />
    <title>CourtFlex</title>
    <style>
      /* Splash: drawn before any script loads, so there's never a blank white page. */
      html,
      body {
        margin: 0;
        background: #001321;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #001321;
        transition:
          opacity 450ms cubic-bezier(0.2, 0.7, 0.2, 1),
          visibility 450ms;
      }
      #splash.done {
        opacity: 0;
        visibility: hidden;
      }
      #splash .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      #splash img {
        height: 64px;
        width: auto;
        animation: splash-in 700ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      #splash .bar {
        position: relative;
        width: 160px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #12395a;
      }
      #splash .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #00d29a, #fcbf0e);
        animation: splash-sweep 1.15s cubic-bezier(0.6, 0, 0.4, 1) infinite;
      }
      @keyframes splash-sweep {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.98);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img,
        #splash .bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading CourtFlex">
      <div class="wrap">
        <img src="/brand/logo.webp" alt="CourtFlex" width="213" height="64" />
        <div class="bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
